name: Update MLB data

on:
  schedule:
    # Every 15 minutes, around the clock -- cheap since games are absent
    # outside season/hours and the API call is a couple of small JSON fetches.
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-mlb-data
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build static site from MLB Stats API
        run: node scripts/build.mjs

      - name: Commit and push if dist changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh MLB data"
            git push
          fi
